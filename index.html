<!DOCTYPE html>
<!--
  ============================================================
  jivablue.com.au  —  Adventures of Crabby
  ============================================================

  This folder is the whole website. Two files, nothing else:

      index.html   this file — the page itself
      crab.webp    the illustration

  HOW TO EDIT IT
  --------------
  Open this file in a plain text editor. VS Code is free and
  ideal; Notepad works. Do NOT open or save it in Microsoft
  Word — Word rewrites it into broken markup.

  Everything you're likely to change is marked with a comment
  beginning "EDIT:". The colours live together in the :root
  block near the top of the style section.

  To preview a change: save, then double-click index.html. It
  opens in your browser. Edit, save, refresh.

  ABOUT THE TITLE LETTERING
  --------------------------
  The title is three lines of script lettering — "Adventures",
  "of", "Crabby" — stacked in the blank sky between the little
  shell flourish near the top of the artwork and the small
  diamond flourish lower down. It's plain SVG text, not a curve:
  each line has its own x/y position and font-size in the BODY
  section, in the SAME 1200 x 1498 units as the illustration, so
  it lines up with the artwork at any screen size.

  To nudge a line, change its "y" (smaller = higher up) or its
  "x" (600 is dead-centre). To resize a line, change the
  font-size for its class (.line-adventures / .line-of /
  .line-crabby) down in the style section. Each line is drawn
  twice — once as a pale halo, once as navy lettering — so keep
  both copies of a line's wording identical.

  ABOUT THE CORNER SIGN
  ----------------------
  The little hanging wooden sign in the top-right corner is a
  picture, but it is NOT a separate file — its data is baked
  right into this document (the long line of letters/numbers
  after "data:image/webp;base64," in the CORNER_SIGN img tag
  below). That keeps the site at just the two files above. To
  reposition or resize it, edit the ".corner-sign" rule in the
  style section (top/right move it, width resizes it — height
  follows automatically). To replace the picture itself, you'd
  need to re-generate that base64 text from a new image file.

  ABOUT THE "ABOUT CRABBY" LINK
  -------------------------------
  Below the picture is a small card — a thumbnail picture plus the
  words "About Crabby" — that links to about.html, a second page
  (currently just a placeholder saying "Coming"). Like the corner
  sign, the thumbnail picture is baked into this file as base64
  text rather than a separate file. Its wording, and where it
  links to, are in the ABOUT_LINK block in the BODY section; its
  look is in the ".about-link" rule in the style section.
  ============================================================
-->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- EDIT: the text shown on the browser tab -->
<title>Adventures of Crabby</title>

<!-- EDIT: the one-line description search engines show -->
<meta name="description" content="Adventures of Crabby — a children's picture book.">

<meta property="og:title" content="Adventures of Crabby">
<meta property="og:description" content="A children's picture book">
<meta property="og:type" content="website">

<!-- The lettering font: Alex Brush, a flowing brush-script face that
     matches the illustration's hand-painted, storybook feel. If it
     fails to load the page falls back to the system fonts listed in
     the CSS and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     COLOURS — sampled from the illustration so the page and the
     picture blend into one another. Change these to restyle.
     ========================================================== */
  :root {
    --paper: #fbf4dd;   /* page background — matches the artwork's edge */
    --ink:   #163a5c;   /* the lettering — deep navy                    */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px;
    overflow-x: hidden;   /* stops a stray sideways scrollbar on phones */
  }

  /* The picture and the lettering are locked together inside this box,
     so the title sits in the same spot on the artwork at every screen
     size. Its shape is set by the script at the bottom of the page. */
  .plate {
    position: relative;
    max-width: 100%;
    max-height: calc(100vh - 160px);
    animation: rise 1s cubic-bezier(.22,.61,.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0);    }
  }

  .plate img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 4px;
    /* A soft shadow so the picture sits on the page rather than
       floating flat against it. Delete this line for no shadow. */
    box-shadow: 0 10px 34px rgba(90, 66, 30, .17);
  }

  /* The title sits in a transparent layer directly on top of the
     picture. Because the SVG's viewBox matches the illustration's real
     dimensions (1200 x 1498), every coordinate below lines up exactly
     with the artwork, at any size. */
  .title {
    position: absolute;
    inset: 0;              /* covers the whole picture */
    margin: 0;
    pointer-events: none;  /* clicks pass through to the page beneath */
  }

  .title svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* EDIT: the look of the lettering. Script fonts read best with NO
     extra letter-spacing — it breaks the joined-up cursive strokes. */
  .title-text {
    font-family: "Alex Brush", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    fill: var(--ink);       /* 'fill' is SVG's word for text colour */
  }

  /* A soft pale halo behind the letters, so they stay readable wherever
     they cross a busier part of the sky. Remove this rule for crisp,
     flat lettering with no glow. */
  .title-halo {
    font-family: "Alex Brush", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    fill: none;
    stroke: #fdf8e8;
    stroke-width: 10px;
    stroke-linejoin: round;
  }

  /* EDIT: font-size for each line, in the picture's own units — see
     "ABOUT THE TITLE LETTERING" up top. */
  .line-the        { font-size: 75px;  }
  .line-adventures { font-size: 160px; }
  .line-of         { font-size: 75px;  }
  .line-crabby     { font-size: 210px; }

  /* EDIT: the hanging sign in the top-right corner — see "ABOUT THE
     CORNER SIGN" up top. top/right nudge its position; width resizes
     it (height follows automatically, keeping its proportions). */
  .plate img.corner-sign {
    position: absolute;
    top: 1.5%;
    right: 3%;
    width: 19%;
    height: auto;
    border-radius: 0;
    box-shadow: none;
    filter: drop-shadow(0 8px 14px rgba(90, 66, 30, .28));
  }

  /* EDIT: the "About Crabby" link card below the picture — see
     'ABOUT THE "ABOUT CRABBY" LINK' up top. */
  .about-link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    text-decoration: none;
    padding: 10px 20px 10px 10px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(90, 66, 30, .18);
    flex-shrink: 0;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .about-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(90, 66, 30, .25);
  }

  .about-link img {
    display: block;
    width: 54px;
    height: auto;
    border-radius: 8px;
  }

  .about-link span {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  /* Respects the visitor's "reduce motion" accessibility setting */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="plate" id="plate">

    <!-- EDIT: to use a different picture, change the filename here

    <img src="images/mainpagebackground.webp" alt="A cheerful red crab on a sunny beach, with a wave curling behind and a sailing boat on the horizon">

    <h1 class="title">
      <svg viewBox="0 0 1200 1498" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Adventures of Crabby">
        <defs>

          <path id="advArc" d="M 170 340 A 1400 1400 0 0 1 1030 340" fill="none"/>

        <!-- Drawn twice per line: once as a thick pale outline (the
             halo), then the navy lettering on top. Keep the wording

        <text class="title-halo line-the"         x="600" y="190" text-anchor="middle">The</text>
        <text class="title-halo line-adventures">
          <textPath href="#advArc" startOffset="50%" text-anchor="middle">Adventures</textPath>

        <text class="title-halo line-crabby"     x="600" y="540" text-anchor="middle">Crabby</text>

        <!-- EDIT: the title wording. Change it in the halo group above
             too, or the halo won't match the letters. -->
        <text class="title-text line-the"         x="600" y="190" text-anchor="middle">The</text>
        <text class="title-text line-adventures">
          <textPath href="#advArc" startOffset="50%" text-anchor="middle">Adventures</textPath>
        </text>
        <text class="title-text line-of"         x="600" y="370" text-anchor="middle">of</text>
        <text class="title-text line-crabby"     x="600" y="540" text-anchor="middle">Crabby</text>

<script>
(function () {
  // The picture's shape, as height divided by width. The current
  // illustration is 1200 x 1498, so 1498/1200 = 1.248.
  // EDIT this if you swap in a differently shaped image.
  var IMG_RATIO = 1498 / 1200;

  var plate = document.getElementById('plate');

  // Sizes the box to the largest that fits the window while keeping the
  // picture's proportions — so the title never drifts off the sky,
  // on a tall phone or a wide monitor alike.
  function fit() {
    var availW = window.innerWidth  - 32;
    var availH = window.innerHeight - 32;

    var w = availW;
    var h = w * IMG_RATIO;

    if (h > availH) {          // too tall for the window — fit by height
      h = availH;
      w = h / IMG_RATIO;
    }

    plate.style.width  = w + 'px';
    plate.style.height = h + 'px';
  }

  fit();
  window.addEventListener('resize', fit);
  // Re-fit once the lettering font has loaded, in case it shifts things
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
